<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Button Animations</title>
    <link rel="stylesheet" href="hw17.css">
</head>

<body>

<div class="buttons-container">

    <button class="btn fill-in">Fill In</button>

    <button class="btn glowing">Glowing</button>

    <button class="btn fill-up">Fill Up</button>

    <button class="btn slide">Slide</button>

    <button class="btn raise">Raise</button>

    <button class="btn close">Close</button>

    <button class="btn notify">Notify Me</button>

    <button class="btn hover-button">Hover Me</button>

    <button class="btn zoom">Zoom</button>

    <button class="btn offset">Offset</button>

    <button class="btn fancy">Fancy Button</button>

    <button class="btn circle-button">Hover Me</button>

    <button class="btn explore">
        Explore More
        <span>→</span>
    </button>

</div>

</body>
</html>
